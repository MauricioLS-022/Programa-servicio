services:
  - type: web
    name: vino-nuevo
    runtime: python
    buildCommand: pip install -r requirements.txt && corepack enable && pnpm --dir frontend install --frozen-lockfile && pnpm --dir frontend run build
    startCommand: gunicorn --chdir backend app:app
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_SSL
        value: "true"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: serv_comunitario
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: RECAPTCHA_SITE_KEY
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
