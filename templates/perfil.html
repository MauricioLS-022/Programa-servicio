{% extends "admin_layout.html" %}

{% block title %}Perfil{% endblock %}

{% block custom_styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='styles/admin/admin.css') }}">
{% endblock %}

{% block content %}
<div class="centro">
    <div class="perfil">
        {% if rol == 'admin' %}
            <img class="img_perfil" src="{{ url_for('static', filename='iconos/administrador.webp') }}" alt="imagen">
        {% elif rol == 'supervisor' %}
            <img class="img_perfil" src="{{ url_for('static', filename='iconos/supervisor.webp') }}" alt="imagen">
        {% else %}
            <img class="img_perfil" src="{{ url_for('static', filename='iconos/casa_de_paz.webp') }}" alt="imagen">
        {% endif %}
        <p class="texto2"><b>Usuario:</b> {{ usuario }}</p>
        <p class="texto2"><b>Rol:</b> {{ rol }}</p>
    </div>
</div>
{% endblock %}
