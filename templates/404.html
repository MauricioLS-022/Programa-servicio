<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vino Nuevo - Página no encontrada</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/404.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/admin/dark_theme.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='logo2.webp') }}" type="image/webp">
    <script>
        (function() {
            try {
                var t = localStorage.getItem('theme');
                if (t === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) {}
        })();
    </script>
</head>
<body class="centro">
    <main class="error-page">
        <div class="error-card">
            <div class="error-code" aria-hidden="true">404</div>
            
            <div class="error-content">
                <h1 class="error-title">Página no encontrada</h1>
                <p class="error-message">
                    Lo sentimos, la página que buscas no existe o ha sido movida.
                </p>
                
                <div class="error-actions">
                    <a href="{{ get_home_url() }}" class="btn btn-primary">
                        <span class="material-symbols-outlined" aria-hidden="true">home</span>
                        Ir al inicio
                    </a>
                    <a href="javascript:history.back()" class="btn btn-secondary error-hint" tabindex="0">
                        <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
                        Volver atrás
                    </a>
                </div>
            </div>
            
            <div class="error-decorations" aria-hidden="true">
                <div class="decoration-circle"></div>
                <div class="decoration-circle"></div>
                <div class="decoration-circle"></div>
            </div>
        </div>
        
        <p class="error-footer">
            Vino Nuevo - Servicio Comunitario
        </p>
    </main>
</body>
</html>
