{% extends "admin_form_layout.html" %} 
{% block content %}
<header class="form-header">
    <h2 class="form-title">Gestión de {{ title }}</h2>
    <p class="form-description">Defina los parámetros de gestión y asigne la supervisión correspondiente para esta unidad organizativa.</p>
</header>

<form class="crud-form" method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
    <span class="material-symbols-outlined form-watermark" style="font-variation-settings: 'FILL' 1;">nest_eco_leaf</span>

    <div class="form-grid">
        
        <!-- Campo sin ícono: lo envolvemos en input-wrapper para mantener la consistencia del CSS -->
        <div class="form-group full-width">
            <label for="nombre">Nombre de la Red</label>
            <div class="input-wrapper">
                <input type="text" id="nombre" name="nombre" value="{{ red.nombre if red else '' }}" placeholder="Ej. Red de Crecimiento Norte" required>
            </div>
        </div>

        <!-- Selector: Aplicamos input-wrapper e icon-right -->
        <div class="form-group full-width">
            <label for="supervisor_id">Supervisor Asignado</label>
            <div class="input-wrapper icon-right">
                <select id="supervisor_id" name="supervisor_id">
                    <option value="" {% if not red or not red.supervisor_id %}selected{% endif %}>-- Sin supervisor asignado --</option>
                    {% for sup in supervisores_disponibles %}
                    <option value="{{ sup.id }}" {% if red and red.supervisor_id == sup.id %}selected{% endif %}>{{ sup.nombre }} {{ sup.apellido }} (@{{ sup.username }})</option>
                    {% endfor %}
                </select>
                <span class="material-symbols-outlined input-icon">expand_more</span>
            </div>
            <span class="input-hint">Muestra los usuarios con rol supervisor disponibles para asignación.</span>
        </div>
    </div>

    <div class="form-actions">
        <div class="actions-left">
            <!-- Se removió la clase with-icon sobrante -->
            <button type="submit" class="btn-save">
                <span class="material-symbols-outlined">save</span>
                Guardar Red
            </button>
            <button type="button" class="btn-cancel">Cancelar</button>
        </div>
        <button type="button" class="btn-delete-text">
            <span class="material-symbols-outlined">delete_outline</span>
            Eliminar Red
        </button>
        
    </div>
</form>
{% endblock %}
